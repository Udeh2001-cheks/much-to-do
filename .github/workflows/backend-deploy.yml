name: Backend Deploy

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - 'Server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        host:
          - ${{ secrets.EC2_HOST_1 }}
          - ${{ secrets.EC2_HOST_2 }}

    steps:
      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/much-to-do

            git pull origin feature/full-stack

            cd Server/MuchToDo

            go build -o app .

            sudo systemctl restart muchtodox
